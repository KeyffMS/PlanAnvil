name: PlanAnvil Codex qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: plananvil-codex-qualification
  cancel-in-progress: false

jobs:
  smoke:
    name: codex smoke test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'smoke'
    environment: plananvil-codex
    runs-on:
      - self-hosted
      - linux
      - x64
      - plananvil
      - codex
    timeout-minutes: 10
    steps:
      - name: Validate controlled runner
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          command -v plananvil-qualification-workspace
          command -v codex
          codex --version

      - name: Run Codex smoke test
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(plananvil-qualification-workspace)"
          test -n "${workspace}"
          test -d "${workspace}"
          cd "${workspace}"
          git init -q
          git rev-parse --is-inside-work-tree

          before="$(git status --porcelain=v1 --untracked-files=all)"
          output="$(codex exec --ephemeral 'Do not modify any files. Reply with exactly PLANANVIL_CODEX_SMOKE_OK.')"
          printf '%s\n' "${output}"
          printf '%s\n' "${output}" | grep -Fq 'PLANANVIL_CODEX_SMOKE_OK'
          after="$(git status --porcelain=v1 --untracked-files=all)"
          test "${before}" = "${after}"

  full:
    name: C01-C16 live qualification
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'full'
    environment: plananvil-codex
    runs-on:
      - self-hosted
      - linux
      - x64
      - plananvil
      - codex
    timeout-minutes: 180
    steps:
      - name: Validate controlled runner
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          command -v plananvil-qualification-workspace
          command -v codex
          command -v git
          command -v python3
          CODEX_VERSION="$(codex --version)"
          printf '%s\n' "${CODEX_VERSION}"
          git --version
          python3 --version
          python3 - "${CODEX_VERSION}" <<'PY'
          import re
          import sys

          raw = sys.argv[1]
          match = re.search(r"(\d+)\.(\d+)\.(\d+)", raw)
          if not match:
              raise SystemExit(f"unable to parse Codex version: {raw}")
          current = tuple(int(part) for part in match.groups())
          minimum = (0, 150, 1)
          if current < minimum:
              raise SystemExit(
                  f"Codex {current[0]}.{current[1]}.{current[2]} is too old for baseline 2.2 live qualification; require >= 0.150.1"
              )
          PY

      - name: Validate Linux Codex sandbox prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            echo "::error::System bubblewrap is required on the trusted Linux qualification runner. Install the Debian bubblewrap package instead of relying on the bundled Codex helper."
            exit 2
          fi
          bwrap --version
          if ! bwrap --unshare-user --unshare-pid --uid 0 --gid 0 --ro-bind / / --proc /proc /bin/true; then
            echo "::error::bubblewrap cannot construct the user/PID/proc namespace required by the Codex command sandbox. Check Podman masked paths/unmask configuration before running C01-C16."
            exit 2
          fi

      - name: Create trusted main qualification workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(plananvil-qualification-workspace)"
          test -n "${workspace}"
          test -d "${workspace}"
          repo="${workspace}/repo"
          artifact="${workspace}/evidence-artifact"
          mkdir -p "${repo}" "${artifact}"

          git -C "${repo}" init -q
          git -C "${repo}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${repo}" fetch --depth=1 origin "${GITHUB_SHA}"
          git -C "${repo}" checkout --detach -q "${GITHUB_SHA}"
          test "$(git -C "${repo}" rev-parse HEAD)" = "${GITHUB_SHA}"

          echo "QUALIFICATION_REPO=${repo}" >> "${GITHUB_ENV}"
          echo "QUALIFICATION_ARTIFACT=${artifact}" >> "${GITHUB_ENV}"

      - name: Validate actual Codex command sandbox
        shell: bash
        run: |
          set -euo pipefail
          cd "${QUALIFICATION_REPO}"
          probe="$(codex exec \
            --ephemeral \
            --json \
            --ignore-user-config \
            --model gpt-5.6-sol \
            --sandbox read-only \
            -c 'approval_policy="never"' \
            -c 'sandbox_workspace_write.network_access=false' \
            -c "projects.$(python3 -c 'import json,os; print(json.dumps(os.getcwd()))').trust_level=\"trusted\"" \
            'Use the shell tool to run /bin/true. Only after that command succeeds, reply with exactly PLANANVIL_CODEX_SANDBOX_OK.')"
          printf '%s\n' "${probe}"
          printf '%s\n' "${probe}" | grep -Fq 'command_execution'
          printf '%s\n' "${probe}" | grep -Fq 'PLANANVIL_CODEX_SANDBOX_OK'

      - name: Materialize and validate evidence templates
        shell: bash
        run: |
          set -euo pipefail
          cd "${QUALIFICATION_REPO}"
          python3 tools/prepare_capabilities.py --force
          python3 tools/validate_capabilities.py

      - name: Run C01-C16 sequential qualification
        id: qualify
        shell: bash
        run: |
          set -euo pipefail
          cd "${QUALIFICATION_REPO}"
          set +e
          python3 tools/live_codex_qualification.py \
            --root "${QUALIFICATION_REPO}" \
            --source-commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --output "${QUALIFICATION_ARTIFACT}"
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload sanitized capability evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plananvil-codex-evidence-${{ github.run_id }}
          path: ${{ env.QUALIFICATION_ARTIFACT }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce live release gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.qualify.outputs.exit_code }}" = "0"
