name: Verify run 27 closure documentation
on:
  push:
    branches: [chore/record-qualified-run27]
    paths: [.github/workflows/stage-run27-docs.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reconstruct exact locally reviewed closure tree and validate it
        run: |
          set -euo pipefail
          python3 .qualification-run27/update_docs.py
          git rm .qualification-run27/update_docs.py .github/workflows/stage-run27-docs.yml
          git add CHANGELOG.md README.md docs/CODEX_SANDBOX_RUNBOOK.md docs/QUALIFICATION_STATUS.md docs/RELEASE.md tests/test_qualification_closure.py
          git diff --cached --check
          test "$(git write-tree)" = '4fbb19ab2520fa838e205c8f27511ad493c5de51'
          git -c user.name='PlanAnvil verification' -c user.email='verification@example.invalid' -c commit.gpgsign=false commit -qm 'Local verification snapshot only; no ref is pushed'
          python3 tools/validate_capabilities.py
          python3 tools/release_check.py
          python3 -m unittest discover -s tests -v
      - name: Store verified content objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,subprocess
          from pathlib import Path
          files=['CHANGELOG.md','README.md','docs/CODEX_SANDBOX_RUNBOOK.md','docs/QUALIFICATION_STATUS.md','docs/RELEASE.md','tests/test_qualification_closure.py']
          entries=[]
          for name in files:
              expected=subprocess.check_output(['git','hash-object',name],text=True).strip()
              payload=json.dumps({'content':base64.b64encode(Path(name).read_bytes()).decode(),'encoding':'base64'})
              result=subprocess.run(['gh','api','--method','POST','repos/KeyffMS/PlanAnvil/git/blobs','--input','-'],input=payload,text=True,capture_output=True,check=True)
              assert json.loads(result.stdout)['sha']==expected
              entries.append({'path':name,'mode':'100644','type':'blob','sha':expected})
          payload=json.dumps({'base_tree':'15e41790681746f5582da1f2e16dc654e1445d89','tree':entries})
          result=subprocess.run(['gh','api','--method','POST','repos/KeyffMS/PlanAnvil/git/trees','--input','-'],input=payload,text=True,capture_output=True,check=True)
          assert json.loads(result.stdout)['sha']=='4fbb19ab2520fa838e205c8f27511ad493c5de51'
          print('VERIFIED_RUN27_CLOSURE_TREE=4fbb19ab2520fa838e205c8f27511ad493c5de51; no refs changed')
          PY
