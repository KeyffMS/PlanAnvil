name: Stage verified run 27 evidence
on:
  push:
    branches: [chore/record-qualified-run27]
    paths: [.github/workflows/stage-run27-evidence.yml]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and stage exact full-run evidence without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, concurrent.futures, hashlib, json, os, shutil, subprocess, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from qualification_artifact import verify_archive
          from qualification_closure import closure_blockers
          from validate_capabilities import validate_all
          source = 'a9cdcdc1e0cad70e88b60869e75e4166046dd306'
          run_id = '34140846679'
          artifact_id = 10026707683
          temp = Path(os.environ['RUNNER_TEMP'])
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(endpoint, payload=None):
              args = ['gh', 'api', 'repos/KeyffMS/PlanAnvil/' + endpoint]
              if payload is not None:
                  args += ['--method', 'POST', '--input', '-']
              result = subprocess.run(args, input=json.dumps(payload) if payload is not None else None,
                                      text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          assert git('rev-parse', 'HEAD^') == source
          subprocess.run(['git', 'archive', '--format=tar.gz', '--output=' + str(temp / 'run27-source.tar.gz'), source], check=True)
          run = api('actions/runs/' + run_id)
          assert run['head_sha'] == source and run['conclusion'] == 'success'
          assert run['event'] == 'workflow_dispatch' and run['actor']['login'] == 'KeyffMS'
          artifact = api('actions/artifacts/' + str(artifact_id))
          outer = subprocess.check_output(['gh', 'api', 'repos/KeyffMS/PlanAnvil/actions/artifacts/' + str(artifact_id) + '/zip'])
          assert digest(outer) == '9583393745fc8292de701c51064e5569f24092e978da7164c8f50070e7d35e73'
          assert artifact['digest'] == 'sha256:' + digest(outer)
          outer_path = temp / 'run27-outer.zip'
          outer_path.write_bytes(outer)
          with zipfile.ZipFile(outer_path) as z:
              assert z.namelist() == ['evidence-artifact.zip']
              inner = z.read('evidence-artifact.zip')
          assert digest(inner) == '83beb50d27198c2cc0ecd72bc6ca4b1ec2d6570bcb23cc0d56c12ec97408ec75'
          inner_path = temp / 'run27-inner.zip'
          inner_path.write_bytes(inner)
          integrity = verify_archive(inner_path)
          history_before = {str(p): digest(p.read_bytes()) for p in Path('qualifications/34060321283').rglob('*') if p.is_file()}
          old_index = json.loads(Path('capabilities/index.json').read_text())
          with zipfile.ZipFile(inner_path) as z:
              summary_bytes = z.read('qualification-summary.json')
              summary = json.loads(summary_bytes)
              assert summary['source_commit'] == source and summary['github_actions_run'] == run_id
              assert summary['release_gate_passed'] is True and summary['required_not_reproduced'] == []
              assert summary['results'] == {f'C{i:02d}': 'REPRODUCED' for i in range(1, 17)}
              new_index = json.loads(z.read('capabilities/index.json'))
              assert new_index['baseline_version'] == old_index['baseline_version']
              for old, new in zip(old_index['capabilities'], new_index['capabilities'], strict=True):
                  assert all(old[k] == new[k] for k in ('id', 'required', 'expected_behavior'))
              for i in range(1, 17):
                  prefix = f'capabilities/C{i:02d}'
                  actual = json.loads(z.read(prefix + '/actual.sanitized.json'))
                  evaluation = json.loads(z.read(prefix + '/evaluation.json'))
                  assert actual['environment']['source_commit'] == source and actual['result'] == 'REPRODUCED'
                  assert evaluation['expected_met'] is True and evaluation['result'] == 'REPRODUCED'
                  shutil.rmtree(prefix)
              for name in z.namelist():
                  if name.startswith('capabilities/') and not name.endswith('/'):
                      target = Path(name)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(name))
          folder = Path('qualifications') / run_id
          folder.mkdir()
          (folder / 'evidence-artifact.zip').write_bytes(inner)
          (folder / 'qualification-summary.json').write_bytes(summary_bytes)
          provenance = {'schema_version': '1.0', 'source_commit': source, 'github_actions_run': run_id,
                        'artifact_id': artifact_id, 'outer_sha256': digest(outer), 'evidence_sha256': digest(inner),
                        'integrity': integrity, 'qualification_mode': 'full',
                        'limitations': ['C13 passed through the explicitly permitted project-scoped non-ephemeral fallback; ephemeral transport remains unsupported in this observed path.']}
          (folder / 'provenance.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          index = json.loads(Path('qualifications/index.json').read_text())
          assert index['baseline_run'] == '34060321283'
          index.update(current_run=run_id, c08_closure='REPRODUCED')
          Path('qualifications/index.json').write_text(json.dumps(index, indent=2, sort_keys=True) + '\n')
          assert history_before == {str(p): digest(p.read_bytes()) for p in Path('qualifications/34060321283').rglob('*') if p.is_file()}
          assert validate_all(Path('.')) == []
          assert closure_blockers(Path('.')) == []
          subprocess.run(['git', 'add', '-A', '--', 'capabilities', 'qualifications'], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/stage-run27-evidence.yml'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          names = git('diff', '--cached', '--name-only', '--diff-filter=AM').splitlines()
          deleted = git('diff', '--cached', '--name-only', '--diff-filter=D').splitlines()
          assert all(n.startswith(('capabilities/', 'qualifications/')) for n in names)
          def store(path):
              data = Path(path).read_bytes()
              expected = git('hash-object', path)
              result = api('git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert result['sha'] == expected
              return {'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              entries = list(pool.map(store, names))
          entries += [{'path': name, 'mode': '100644', 'type': 'blob', 'sha': None} for name in deleted]
          result = api('git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          assert result['sha'] == git('write-tree')
          subprocess.run(['git', 'archive', '--format=tar.gz', '--output=' + str(temp / 'run27-imported.tar.gz'), result['sha']], check=True)
          report = {'tree': result['sha'], 'parent': git('rev-parse', 'HEAD'), 'source_commit': source,
                    'changed_files': len(entries), 'integrity': integrity, 'closure_blockers': [],
                    'source_archive_sha256': digest((temp / 'run27-source.tar.gz').read_bytes()),
                    'imported_archive_sha256': digest((temp / 'run27-imported.tar.gz').read_bytes())}
          (temp / 'run27-stage.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: run27-reviewed-import-stage
          path: |
            ${{ runner.temp }}/run27-source.tar.gz
            ${{ runner.temp }}/run27-imported.tar.gz
            ${{ runner.temp }}/run27-stage.json
          retention-days: 3
          if-no-files-found: error
