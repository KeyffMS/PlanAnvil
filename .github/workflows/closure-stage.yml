name: Stage tested qualification closure
on:
  push:
    branches: [chore/qualification-closure]
    paths: [.github/workflows/closure-stage.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reconstruct source-bound reviewed edits and store verified blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, concurrent.futures, gzip, hashlib, json, os, subprocess
          from pathlib import Path, PurePosixPath
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path, payload=None):
              args = ['gh', 'api', 'repos/KeyffMS/PlanAnvil/' + path]
              if payload is not None:
                  args += ['--method', 'POST', '--input', '-']
              result = subprocess.run(args, input=json.dumps(payload) if payload is not None else None,
                                      text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          shas = ['86d4b5e71c90fadf208500abef2f2a152dff470f', 'e28e0f726cbebeb9add4d8fe32ee9909e28b7ad7',
                  '4d06f8286047edf87ddb84330898b05d48e97622', '5703e08db8a9b9e1f3490c271ea077589f9b650a']
          compressed = b''
          for sha in shas:
              data = base64.b64decode(api('git/blobs/' + sha)['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              compressed += data
          raw = gzip.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest() == 'bc583f6b6a7f6e7b07b4c6450f2994fe9d7faed463c40286a174f2c01ab963c2'
          updates = json.loads(raw)
          assert len(updates) == 27
          entries = []
          seen = set()
          for item in updates:
              name = item['path']
              parts = PurePosixPath(name)
              assert not parts.is_absolute() and '..' not in parts.parts and name not in seen
              seen.add(name)
              path = Path(name)
              if item['base'] is None:
                  assert not path.exists()
                  text = item['text']
              else:
                  data = path.read_bytes()
                  assert hashlib.sha256(data).hexdigest() == item['base'], name
                  lines = data.decode('utf-8').splitlines(keepends=True)
                  for edit in reversed(item['edits']):
                      lines[edit['start']:edit['end']] = edit['text'].splitlines(keepends=True)
                  text = ''.join(lines)
              data = text.encode('utf-8')
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert sha == item['sha'], name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          subprocess.run(['git', 'rm', '.github/workflows/closure-stage.yml', '.github/workflows/closure-recover.yml'], check=True)
          subprocess.run(['git', 'add', '--', *sorted(seen)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert git('write-tree') == 'a7c30b3d576df1682818320e4d616a1014d0581a'
          def store(entry):
              payload = {'encoding': 'base64', 'content': base64.b64encode(Path(entry['path']).read_bytes()).decode()}
              assert api('git/blobs', payload)['sha'] == entry['sha']
              return entry
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              stored = list(pool.map(store, entries))
          Path(os.environ['RUNNER_TEMP'], 'closure-entries.json').write_text(json.dumps(stored, indent=2))
          print('VERIFIED_CLOSURE_BLOBS=27; VERIFIED_TREE=a7c30b3d576df1682818320e4d616a1014d0581a; no refs changed')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tested-closure-entries
          path: ${{ runner.temp }}/closure-entries.json
          if-no-files-found: error
          retention-days: 2
