name: Recover preserved closure candidate
on:
  push:
    branches: [chore/qualification-closure]
    paths: [.github/workflows/closure-recover.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download preserved content objects without executing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/closure-preserved"
          export OUT="$RUNNER_TEMP/closure-preserved"
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          shas = ['f852ffdfb67ddde885658b5090fb32e0fe95ac00', '57c04e18b479a16f3c5a07d7090eb776657f92ad', '516c6d514484922d81eae51605bc35d111d3d407', 'd9fada2bb5b792aa44c55a65414721f94ce78194', '773fced7dea07c6988f4e981880925ab6969fd4d']
          for sha in shas:
              obj = json.loads(subprocess.check_output(['gh', 'api', 'repos/KeyffMS/PlanAnvil/git/blobs/' + sha]))
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              Path(os.environ['OUT'], sha + '.bin').write_bytes(data)
              print(sha, len(data))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: closure-preserved-candidate
          path: ${{ runner.temp }}/closure-preserved
          retention-days: 2
          if-no-files-found: error
