name: PlanAnvil release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release:
    name: validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify signed annotated tag and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          ref = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{repository}/git/ref/tags/{tag}"
          ], text=True))
          obj = ref.get("object", {})
          if obj.get("type") != "tag":
              raise SystemExit("release tag must be an annotated signed tag; lightweight tags are rejected")
          tag_obj = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{repository}/git/tags/{obj.get('sha')}"
          ], text=True))
          verification = tag_obj.get("verification") or {}
          if verification.get("verified") is not True:
              reason = verification.get("reason", "unknown")
              raise SystemExit(f"release tag signature is not verified by GitHub: {reason}")
          if (tag_obj.get("object") or {}).get("type") != "commit":
              raise SystemExit("release tag must point directly to a commit")
          print("GitHub verified release tag signature.")
          PY
          git fetch origin main
          TAGGED_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{}")"
          git merge-base --is-ancestor "$TAGGED_COMMIT" origin/main || {
            echo "Release tag target is not reachable from origin/main." >&2
            exit 1
          }
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Configure Git fixture identity
        run: |
          git config --global user.name "PlanAnvil Release CI"
          git config --global user.email "plananvil-release@example.invalid"
          git config --global commit.gpgsign false
          git config --global protocol.file.allow always
      - name: Compile deterministic code
        run: python -m compileall -q .agents/skills/plan-anvil .codex/hooks tools tests
      - name: Run core tests
        run: python -m unittest discover -s .agents/skills/plan-anvil/tests -v
      - name: Run distribution tests
        run: python -m unittest discover -s tests -v
      - name: Validate live capability evidence
        run: python tools/validate_capabilities.py
      - name: Enforce production release gate
        run: python tools/release_check.py --tag "${GITHUB_REF_NAME}"
      - name: Build release archive
        run: python tools/build_release.py --output dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          gh release create "v${VERSION}" \
            "dist/plananvil-${VERSION}.zip" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --title "PlanAnvil ${VERSION}" \
            --notes-file dist/release-notes.md
